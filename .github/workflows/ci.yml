name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: unison_test
          MYSQL_USER: unison
          MYSQL_PASSWORD: unison
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=5s --health-timeout=5s --health-retries=30
    env:
      DATABASE_URL: mysql+pymysql://unison:unison@127.0.0.1:3306/unison_test?charset=utf8mb4
      TEST_DATABASE_URL: mysql+pymysql://unison:unison@127.0.0.1:3306/unison_test?charset=utf8mb4
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Lint (Ruff)
        run: |
          ruff check .
          ruff format --check .

      - name: Tests with coverage
        run: pytest --cov=app --cov-report=term --cov-report=xml --cov-report=html

      - name: Coverage summary
        if: always()
        run: |
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import xml.etree.ElementTree as ET
          rate = float(ET.parse("coverage.xml").getroot().get("line-rate")) * 100
          print(f"### Backend coverage: {rate:.1f}% of lines")
          PY

      - name: Upload the coverage report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: backend-coverage
          path: backend/htmlcov

  compose:
    runs-on: ubuntu-latest
    needs: backend
    steps:
      - uses: actions/checkout@v6
      - name: Start the stack from a fresh clone
        run: |
          docker compose up --build --detach
          for i in $(seq 1 60); do
            curl --fail --silent http://localhost:8000/api/v1/health && exit 0
            sleep 5
          done
          echo "The backend did not become healthy in 5 minutes"
          exit 1
      - name: The API answers
        run: |
          curl --fail --silent http://localhost:8000/api/v1/health
      - name: Show service status and logs
        if: always()
        run: |
          docker compose ps --all
          docker compose logs --no-color backend
      - name: Stop
        if: always()
        run: docker compose down --volumes
