name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: unison_test
          MYSQL_USER: unison
          MYSQL_PASSWORD: unison
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=5s --health-timeout=5s --health-retries=30
    env:
      DATABASE_URL: mysql+pymysql://unison:unison@127.0.0.1:3306/unison_test?charset=utf8mb4
      TEST_DATABASE_URL: mysql+pymysql://unison:unison@127.0.0.1:3306/unison_test?charset=utf8mb4
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Lint (Ruff)
        run: |
          ruff check .
          ruff format --check .

      - name: Migrations apply, roll back and apply again
        run: |
          alembic upgrade head
          alembic downgrade base
          alembic upgrade head

      - name: Models match the migrations
        run: alembic check

      - name: Tests with coverage
        run: pytest --cov=app --cov-report=term --cov-report=xml --cov-report=html --cov-fail-under=70

      - name: OpenAPI YAML matches the code
        run: python scripts/export_openapi.py --check

      - name: Coverage summary
        if: always()
        run: |
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import xml.etree.ElementTree as ET
          rate = float(ET.parse("coverage.xml").getroot().get("line-rate")) * 100
          print(f"### Backend coverage: {rate:.1f}% of lines")
          PY

      - name: Upload the coverage report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: backend-coverage
          path: backend/htmlcov

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint (ESLint)
        run: npm run lint

      - name: Tests with coverage (Vitest)
        run: npx vitest run --coverage

      - name: Production build
        run: npm run build

      - name: Coverage summary
        if: always()
        run: |
          node -e "const t = require('./coverage/coverage-summary.json').total; console.log('### Frontend coverage: ' + t.lines.pct + '% of lines')" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload the coverage report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: frontend-coverage
          path: frontend/coverage

  compose:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v6
      - name: Start the stack from a fresh clone
        run: |
          docker compose up --build --detach
          for i in $(seq 1 60); do
            curl --fail --silent http://localhost:8080/api/v1/health && exit 0
            sleep 5
          done
          echo "The app did not answer on http://localhost:8080 in 5 minutes"
          exit 1
      - name: The app, the API, the seed data, Mailpit and phpMyAdmin answer
        run: |
          curl --fail --silent http://localhost:8080/healthz
          curl --fail --silent http://localhost:8080/ | grep -q '<div id="root">'
          curl --fail --silent http://localhost:8080/courses/1 | grep -q '<div id="root">'
          curl --fail --silent http://localhost:8000/api/v1/health
          curl --fail --silent "http://localhost:8080/api/v1/courses?q=CS301&size=1" | grep -q CS301
          curl --fail --silent --output /dev/null http://localhost:8025
          for i in $(seq 1 30); do
            curl --fail --silent --output pma.html http://localhost:8081 && break
            sleep 2
          done
          grep -q phpMyAdmin pma.html
      - name: Show service status and logs
        if: always()
        run: |
          docker compose ps --all
          docker compose logs --no-color init backend worker frontend phpmyadmin
      - name: Stop
        if: always()
        run: docker compose down --volumes
