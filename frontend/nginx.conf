# Serves the built React app and forwards /api to the backend, so the browser sees one
# site (localhost:8080): the session cookie works and no CORS setup is needed.

# On a real server Caddy sits in front and handles HTTPS; keep its "https".
map $http_x_forwarded_proto $original_proto {
    default $http_x_forwarded_proto;
    ''      $scheme;
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # 5 draft files of 10 MB each, plus room for the form encoding
    client_max_body_size 60m;
    server_tokens off;

    # Behind Caddy (docker-compose.prod.yml), the visitor's address arrives in
    # X-Forwarded-For from inside the Docker network; use it for rate limits.
    set_real_ip_from 10.0.0.0/8;
    set_real_ip_from 172.16.0.0/12;
    set_real_ip_from 192.168.0.0/16;
    real_ip_header X-Forwarded-For;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy same-origin always;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $original_proto;
        proxy_set_header X-Request-ID $request_id;
        proxy_read_timeout 60s;
    }

    # Hashed build files never change, so browsers may keep them.
    location /assets/ {
        try_files $uri =404;
        expires 7d;
    }

    # Any other path is a page of the React app.
    location / {
        try_files $uri /index.html;
    }
}
