          minimum: 1
          description: Page number, from 1.
          default: 1
          title: Page
        description: Page number, from 1.
      - name: size
        in: query
        required: false
        schema:
          type: integer
          maximum: 50
          minimum: 1
          description: Items per page, 1 to 50.
          default: 20
          title: Size
        description: Items per page, 1 to 50.
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
