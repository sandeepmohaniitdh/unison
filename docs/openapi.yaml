components:
  schemas:
    Accepted:
      properties:
        message:
          type: string
          title: Message
      type: object
      required:
      - message
      title: Accepted
    AdjustmentIn:
      properties:
        percent:
          anyOf:
          - type: number
            maximum: 10.0
            minimum: -20.0
          - type: string
            pattern: ^(?!^[-+.]*$)[+-]?0*\d*\.?\d{0,1}0*$
          title: Percent
          description: Of the team mark, from -20 to +10.
        reason:
          type: string
          maxLength: 2000
          minLength: 3
          title: Reason
          description: Shown to the member.
      type: object
      required:
      - percent
      - reason
      title: AdjustmentIn
    AdminEmail:
      properties:
        id:
          type: integer
          title: Id
        email:
          type: string
          title: Email
        is_primary:
          type: boolean
          title: Is Primary
        verified:
          type: boolean
          title: Verified
      type: object
      required:
      - id
      - email
      - is_primary
      - verified
      title: AdminEmail
    AdminEnrolment:
      properties:
        course_id:
          type: integer
          title: Course Id
        code:
          type: string
          title: Code
        title:
          type: string
          title: Title
        term:
          type: string
          title: Term
        role:
          type: string
          title: Role
        status:
          type: string
          title: Status
      type: object
      required:
      - course_id
      - code
      - title
      - term
      - role
      - status
      title: AdminEnrolment
    AiDraftOut:
      properties:
        id:
          type: integer
          title: Id
        final_id:
          type: integer
          title: Final Id
        file_id:
          type: integer
          title: File Id
        status:
          type: string
          enum:
          - queued
          - running
          - ready
          - failed
          title: Status
        model:
          type: string
          title: Model
        created_at:
          type: string
          format: date-time
          title: Created At
          example: '2026-11-05T23:59:59+05:30'
        finished_at:
          anyOf:
          - type: string
            format: date-time
            example: '2026-11-05T23:59:59+05:30'
          - type: 'null'
          title: Finished At
        error_code:
          anyOf:
          - type: string
          - type: 'null'
          title: Error Code
        message:
          anyOf:
          - type: string
          - type: 'null'
          title: Message
          description: For failed drafts, e.g. 'Feedback draft unavailable; review manually.'
        truncation_note:
          anyOf:
          - type: string
          - type: 'null'
          title: Truncation Note
          description: Shown when the report was longer than 12,000 characters.
        injection_suspected:
          type: boolean
          title: Injection Suspected
          description: 'The report contains instruction-like text: check it by hand.'
        suggestions:
          items:
            $ref: '#/components/schemas/Suggestion'
          type: array
          title: Suggestions
      type: object
      required:
      - id
      - final_id
      - file_id
      - status
      - model
      - created_at
      - finished_at
