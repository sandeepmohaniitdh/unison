openapi: 3.1.0
info:
  title: Unison API
  description: "REST API of **Unison**, a learning management system with collaborative group submissions\n(CS602C Advanced\
    \ Software Development Lab, IIT Dharwad, Team Bootstrap).\n\n**Conventions**\n\n- All paths are under `/api/v1`, plural\
    \ and kebab-case.\n- Every list takes `?page=1&size=20` (size 1 to 50) and returns `{items, page, size, total}`, in a\
    \ fixed order.\n- Every error has the same body: `{\"error\": {\"code\", \"message\", \"details\", \"request_id\"}}`.\n\
    - Times are ISO 8601 in Indian Standard Time (`+05:30`). A time sent without an offset is read as IST.\n- 401: not logged\
    \ in. 403: not allowed. 404: not found, or not yours to know about. 409: conflicts with\n  the current state. 422: invalid\
    \ input. 429: rate limit.\n\n**Logging in**\n\n- The site uses a session cookie (`POST /auth/login`). Requests that change\
    \ something and use the cookie\n  must also send the header `X-Unison-Client: web`.\n- In demo mode (`AUTH_MODE=demo`,\
    \ the default in docker-compose), click **Authorize** and type a seeded\n  email in `X-Demo-User`, for example `demo.student@example.com`,\
    \ `demo.teacher@example.com` or\n  `demo.admin@example.com`."
  version: 1.0.0
servers:
- url: /
  description: This server
paths:
  /api/v1/health:
    get:
      tags:
      - health
      summary: Is the API up?
      operationId: health_health
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
        '422':
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
        '500':
          description: Unexpected server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
        '503':
          description: Service not available
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
  /api/v1/auth/config:
    get:
      tags:
      - auth
      summary: Login options for the sign-in page
      operationId: auth_auth_config
      responses:
