# Unison: `docker compose up --build` starts everything. No .env file is needed.
#
#   API and Swagger UI  http://localhost:8000/api/v1/docs
#   MySQL from your PC  localhost:3307, user unison, password unison
#
# The frontend (React, served by nginx on http://localhost:8080) is added in its own pull request.

name: unison

x-backend-env: &backend-env
  DATABASE_URL: mysql+pymysql://unison:unison@db:3306/unison?charset=utf8mb4
  # demo: the X-Demo-User header logs you in as any seeded user (for Swagger).
  # Set AUTH_MODE to "session" for real logins only.
  AUTH_MODE: demo
  COOKIE_SECURE: "false"
  FRONTEND_URL: http://localhost:8080
  API_URL: http://localhost:8000
  SECRET_KEY: ${SECRET_KEY:-dev-secret-change-me}
  UPLOAD_DIR: /data/uploads

services:
  db:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: unison
      MYSQL_USER: unison
      MYSQL_PASSWORD: unison
      MYSQL_ROOT_PASSWORD: root
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_0900_ai_ci"]
    volumes:
      - db_data:/var/lib/mysql
      - ./db/init:/docker-entrypoint-initdb.d:ro
    ports:
      - "3307:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s

  # Runs once: the database migrations.
  init:
    build: ./backend
    command: ["python", "-m", "app.bootstrap"]
    environment: *backend-env
    volumes:
      - uploads:/data/uploads
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  backend:
    build: ./backend
    environment: *backend-env
    volumes:
      - uploads:/data/uploads
    ports:
      - "8000:8000"
    depends_on:
      init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health')"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  # Only with --profile test:  docker compose --profile test run --rm tests
  tests:
    profiles: ["test"]
    build:
      context: ./backend
      args:
        INSTALL_DEV: "true"
    environment:
      TEST_DATABASE_URL: mysql+pymysql://unison:unison@db:3306/unison_test?charset=utf8mb4
      DATABASE_URL: mysql+pymysql://unison:unison@db:3306/unison_test?charset=utf8mb4
    command: ["pytest", "--cov=app", "--cov-report=term"]
    depends_on:
      db:
        condition: service_healthy

volumes:
  db_data:
  uploads:
