# Unison: `docker compose up --build` starts everything. No .env file is needed.
#
#   The app             http://localhost:8080
#   API and Swagger UI  http://localhost:8000/api/v1/docs
#   Mailpit (emails)    http://localhost:8025
#   Database dashboard  http://localhost:8081 (phpMyAdmin), user unison, password unison
#   MySQL from your PC  localhost:3307, user unison, password unison

name: unison

x-backend-env: &backend-env
  # Every ${NAME:-default} below can be set in a .env file next to this one (never committed).
  # The defaults are for a laptop; docs/DEPLOYMENT.md lists the values for a real server.
  APP_ENV: ${APP_ENV:-development}
  DATABASE_URL: mysql+pymysql://unison:${MYSQL_PASSWORD:-unison}@db:3306/unison?charset=utf8mb4
  # demo: the X-Demo-User header logs you in as any seeded user (for Swagger).
  # A real site uses "session": only the login cookie counts.
  AUTH_MODE: ${AUTH_MODE:-demo}
  COOKIE_SECURE: ${COOKIE_SECURE:-false}
  # Where people open the site. The browser reaches the API through the same address.
  FRONTEND_URL: ${SITE_URL:-http://localhost:8080}
  API_URL: ${SITE_URL:-http://localhost:8080}
  # nginx sets X-Forwarded-For, so rate limits see the real client address.
  TRUST_PROXY: "true"
  SECRET_KEY: ${SECRET_KEY:-dev-secret-change-me}
  ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@example.com}
  ADMIN_PASSWORD: ${ADMIN_PASSWORD:-unison-admin}
  # Mailpit catches every email locally; a real server uses a mail service.
  SMTP_HOST: ${SMTP_HOST:-mailpit}
  SMTP_PORT: ${SMTP_PORT:-1025}
  SMTP_USERNAME: ${SMTP_USERNAME:-}
  SMTP_PASSWORD: ${SMTP_PASSWORD:-}
  SMTP_STARTTLS: ${SMTP_STARTTLS:-false}
  SMTP_FROM: ${SMTP_FROM:-Unison <no-reply@unison.local>}
  UPLOAD_DIR: /data/uploads
  SEED_ON_START: ${SEED_ON_START:-true}
  # Optional: Google sign-in and AI drafts. Empty values switch them off.
  GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
  GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
  AI_PROVIDER: ${AI_PROVIDER:-none}
  GEMINI_API_KEY: ${GEMINI_API_KEY:-}

services:
  db:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: unison
      MYSQL_USER: unison
      # Used only when the database volume is first created.
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-unison}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_0900_ai_ci"]
    volumes:
      - db_data:/var/lib/mysql
      - ./db/init:/docker-entrypoint-initdb.d:ro
    ports:
      - "3307:3306"
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p\"$$MYSQL_ROOT_PASSWORD\""]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s

  # Runs once: migrations, default settings, the first admin, then the seed data.
  init:
    build: ./backend
    command: ["python", "-m", "app.bootstrap"]
    environment: *backend-env
    volumes:
      - uploads:/data/uploads
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  backend:
    build: ./backend
    environment: *backend-env
    volumes:
      - uploads:/data/uploads
    ports:
      - "8000:8000"
    depends_on:
      init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health')"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  # Background jobs every 30 s: emails, deadlines, invitation expiry, AI drafts, account deletion.
  worker:
    build: ./backend
    command: ["python", "-m", "app.worker"]
    environment: *backend-env
    volumes:
      - uploads:/data/uploads
    depends_on:
      init:
        condition: service_completed_successfully
      mailpit:
        condition: service_started
    healthcheck:
      test: ["CMD", "python", "-c", "import os, sys, time; sys.exit(time.time() - os.path.getmtime('/tmp/unison-worker-heartbeat') > 90)"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 40s
    restart: unless-stopped

  # The React app, served by nginx, which forwards /api to the backend.
  frontend:
    build: ./frontend
    ports:
      - "8080:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

  # Database dashboard (phpMyAdmin) on http://localhost:8081, for your laptop only.
  # Log in with user "unison" and password "unison" (or MYSQL_PASSWORD from .env);
  # "root" / "root" also sees the test database. Not started on a real server.
  phpmyadmin:
    image: phpmyadmin:5.2
    environment:
      PMA_HOST: db
      PMA_PORT: "3306"
      UPLOAD_LIMIT: 64M
    ports:
      - "127.0.0.1:8081:80"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  mailpit:
    image: axllent/mailpit:v1.31.6
    ports:
      - "8025:8025"

  # Only with --profile test:  docker compose --profile test run --rm tests
  tests:
    profiles: ["test"]
    build:
      context: ./backend
      args:
        INSTALL_DEV: "true"
    environment:
      TEST_DATABASE_URL: mysql+pymysql://unison:${MYSQL_PASSWORD:-unison}@db:3306/unison_test?charset=utf8mb4
      DATABASE_URL: mysql+pymysql://unison:${MYSQL_PASSWORD:-unison}@db:3306/unison_test?charset=utf8mb4
    command: ["pytest", "--cov=app", "--cov-report=term"]
    depends_on:
      db:
        condition: service_healthy

volumes:
  db_data:
  uploads:
